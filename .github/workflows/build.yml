name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Updates can be uploaded from a phone as a single update.zip; unpack it into the repo.
      - name: Apply update.zip
        run: |
          if [ -f update.zip ]; then
            unzip -o update.zip
            git rm -q update.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply update.zip"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building with the debug key."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      # Put compile errors on the run's summary page so they can be read without opening the log.
      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          wrong=$(grep -A8 'What went wrong' build.log | head -10 | tr '\n' ' ')
          [ -n "$wrong" ] && echo "::error::${wrong}" || true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk AlzaDash.apk
          # The Play Store bundle is only useful when signed with the real key.
          if [ -n "$SIGNING_KEYSTORE" ]; then cp app/build/outputs/bundle/release/app-release.aab AlzaDash.aab; fi

      - uses: actions/upload-artifact@v4
        with:
          name: AlzaDash
          path: AlzaDash.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AlzaDash (latest build)
          body: Download AlzaDash.apk below and open it on your phone. AlzaDash.aab is for uploading to Google Play.
          files: |
            AlzaDash.apk
            AlzaDash.aab
          make_latest: true
