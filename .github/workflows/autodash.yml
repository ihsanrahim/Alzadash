name: Build Autodash APK

on:
  push:
    branches: ['**']
    paths:
      - 'autodash/**'
      - '.github/workflows/autodash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autodash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Same signing key as AlzaDash, from the repository's Actions secrets.
      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building with the debug key."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          wrong=$(grep -A8 'What went wrong' build.log | head -10 | tr '\n' ' ')
          [ -n "$wrong" ] && echo "::error::${wrong}" || true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Autodash.apk
          cp app/build/outputs/bundle/release/app-release.aab Autodash.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Autodash
          path: |
            autodash/Autodash.apk
            autodash/Autodash.aab

      # Its own release, separate from AlzaDash's "latest".
      - name: Publish to the "autodash-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autodash-latest
          target_commitish: ${{ github.sha }}
          name: Autodash (latest build)
          body: Autodash.apk installs as a normal app (phone dashboard, browser, Autodash Radio in Android Auto). Autodash.aab is for Google Play internal testing, which also puts the dashboard and browser on the car screen.
          files: |
            autodash/Autodash.apk
            autodash/Autodash.aab
          make_latest: false
